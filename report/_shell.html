<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenMythos 與 OpenRouter Fusion：迴圈深度與多模型審議研究報告</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
  <style>
    /* PingFang（macOS 系統中文 fallback）無法嵌入列印 PDF，
       中文一律明確指定可嵌入字型，禁止落到 system-ui / 裸 sans-serif */
    :root {
      --ink: #1a1a1a;
      --ink-light: #555;
      --rule: #c9c9c9;
      --accent: #1e4e79;
      --bg-code: #f5f5f3;
      --font-main: 'Noto Sans TC', 'Heiti TC', 'Arial Unicode MS', 'Microsoft JhengHei', sans-serif;
      --font-display: 'Noto Serif TC', 'Songti TC', 'Noto Sans TC', 'Heiti TC', serif;
      --font-mono: 'SF Mono', 'Consolas', 'Noto Sans TC', 'Heiti TC', monospace;
    }
    @page { size: A4; margin: 20mm 18mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      font-size: 10.5pt;
      line-height: 1.85;
      color: var(--ink);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }
    @media screen {
      body { max-width: 760px; margin: 3rem auto; padding: 0 1.5rem; }
    }

    /* 文件頭 */
    .doc-header { border-bottom: 3px solid var(--ink); padding-bottom: 1.2rem; margin-bottom: 0.4rem; }
    .doc-kicker { font-size: 8.5pt; letter-spacing: 0.35em; color: var(--ink-light); margin-bottom: 0.6rem; }
    .doc-header h1 { font-family: var(--font-display); font-size: 21pt; font-weight: 700; line-height: 1.4; }
    .doc-meta { display: flex; gap: 2.5rem; border-bottom: 1px solid var(--rule); padding: 0.5rem 0; margin-bottom: 2rem; font-size: 8.5pt; color: var(--ink-light); }
    .doc-meta b { color: var(--ink); font-weight: 500; margin-left: 0.5em; }

    /* 章節 */
    section { margin-bottom: 2.2rem; }
    h2 {
      font-size: 13pt; font-weight: 700;
      border-left: 4px solid var(--accent);
      padding-left: 0.7rem;
      margin-bottom: 0.9rem;
    }
    h3 { font-size: 11pt; font-weight: 500; color: var(--accent); margin: 1.3rem 0 0.5rem; }
    p { margin-bottom: 0.7rem; text-align: justify; }
    ul, ol { padding-left: 1.6rem; margin-bottom: 0.7rem; }
    li { margin-bottom: 0.25rem; }

    /* 表格：細水平線，無斑馬紋 */
    table { width: 100%; border-collapse: collapse; margin: 0.8rem 0 1rem; font-size: 9.5pt; }
    th { text-align: left; font-weight: 500; border-bottom: 2px solid var(--ink); padding: 0.4rem 0.6rem; }
    td { border-bottom: 1px solid var(--rule); padding: 0.45rem 0.6rem; }
    .num { text-align: right; font-variant-numeric: tabular-nums; }

    /* 程式碼 */
    pre, code { font-family: var(--font-mono); font-size: 8.5pt; }
    pre { background: var(--bg-code); padding: 0.9rem 1.1rem; margin: 0.8rem 0; line-height: 1.6; white-space: pre-wrap; }
    code { background: var(--bg-code); padding: 0.1em 0.35em; }

    /* 重點框 */
    .note { border: 1px solid var(--ink); padding: 0.7rem 1rem; margin: 1rem 0; font-size: 9.5pt; }
    .note > b:first-child { display: block; font-size: 8.5pt; letter-spacing: 0.2em; margin-bottom: 0.25rem; }

    /* 圖表 */
    figure { margin: 1rem 0; }
    figure svg { width: 100%; height: auto; max-height: 110mm; }
    figcaption { font-size: 8.5pt; color: var(--ink-light); margin-top: 0.35rem; text-align: center; }

    /* 中英對照術語標記 */
    .term { font-weight: 500; }
    .en { color: var(--ink-light); font-size: 9pt; }

    /* 分頁控制 */
    section, table, pre, .note, figure { break-inside: avoid; }
    h2, h3 { break-after: avoid; }

    /* ── 格線系統：多欄版面 ────────────── */
    :root { --gap: 5mm; }
    .cols-2   { display: grid; grid-template-columns: 1fr 1fr;     gap: var(--gap); }
    .cols-3   { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--gap); }
    .cols-2-1 { display: grid; grid-template-columns: 2fr 1fr;     gap: var(--gap); }
    .cols-1-2 { display: grid; grid-template-columns: 1fr 2fr;     gap: var(--gap); }
    .cols-2, .cols-3, .cols-2-1, .cols-1-2 {
      align-items: start;
      break-inside: avoid;
      margin-bottom: 1.2rem;
    }
    .cols-2 > *, .cols-3 > *, .cols-2-1 > *, .cols-1-2 > * { min-width: 0; }
    .cols-2 figure svg { max-height: 80mm; }
  </style>
</head>
<body>

<!-- PAGES -->

</body>
</html>
